# Test the emulator, build the site (the emulator's page and the FM-1 SID player) and publish
# it on GitHub Pages from the Actions artifact (Settings -> Pages -> Source: GitHub Actions).

name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# (publishing rights are the deploy job's alone)
permissions:
  contents: read

# One run at a time for each branch: master's runs build and deploy in the order they were pushed
# (with only the deploy jobs in a group, a slower build of an older push would deploy last and
# leave the site behind master). A pull request has its own group, so its tests wait behind no
# other run, and a new push to it replaces the run of the one before.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # fm1-sid/: joakimeriksson/fm1-sid

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      # The CPU, decoder and peripherals (fm1-live needs ALSA headers, the tests do not).
      - name: Unit tests
        run: cargo test --release -p fm1-isa -p fm1-core -p fm1-soc -p fm1-web -p fm1-map

      # The README's table of firmwares (links that open each one on the page) matches the catalog.
      - name: README firmware table
        run: node tools/readme_firmwares.mjs --check

      - name: Build the site
        run: tools/build_site.sh _site

      # After the build: the wasm JIT's self-test needs the wasm, and skips itself without one.
      # A test that skips here checks nothing, so none may.
      - name: Browser code regression tests
        run: |
          set -o pipefail
          FM1_WASM=_site/fm1_web.wasm node --test --test-reporter=tap web/*.test.mjs | tee tests.tap
          if grep -n '# SKIP' tests.tap; then echo "::error::a test skipped itself"; exit 1; fi

      # The emulator's wasm boots a real firmware (Felucca, fetched from its author's site like
      # the page does) to audio and a screen, and a MIDI note sounds.
      - name: Test the emulator page
        run: node web/smoke.mjs _site

      - name: WASM save round trip
        run: node web/persistence.wasm.mjs _site

      # The wasm JIT against the wasm interpreter (its oracle), as the jobs below do for the native
      # JITs: the page's own build gives the same audio either way, byte for byte, and the JIT did
      # compile. FM-1 SID's package is in the tree; Felucca and mono2k (two cores) come from their
      # authors' sites, and one of those that could not be fetched is said, not failed.
      - name: WASM JIT against the interpreter
        run: |
          node tools/fetch_firmwares.mjs felucca mono2k
          test -f fm1-sid/web/sidplayer.fwsc
          for pkg in fm1-sid/web/sidplayer.fwsc reference/firmwares/felucca.fwsc reference/firmwares/mono2k.fwsc; do
            test -f "$pkg" || { echo "::warning::$pkg was not fetched: its JIT audio was not compared"; continue; }
            FM1_WASM=_site/fm1_web.wasm FM1_FWSC=$pkg FM1_BENCH_JSON=jit.json node web/bench.mjs 240 5 jit.raw > /dev/null
            FM1_WASM=_site/fm1_web.wasm FM1_FWSC=$pkg FM1_NO_JIT=1 node web/bench.mjs 240 5 int.raw > /dev/null
            test "$(stat -c %s jit.raw)" -gt 100000
            cmp jit.raw int.raw
            node -e 'const j = require("./jit.json").jit; if (!(j.regions > 0) || j.failed) { console.error("the JIT did not run", j); process.exit(1); }'
            echo "$pkg: $(stat -c %s jit.raw) bytes, the same with the JIT and interpreted"
          done

      # The SMK-37 page's wasm boots an SMK-37 build (GHOULBOX, from genkigenki's install page)
      # as the SMK-37 board, and a key on its keybed sounds.
      - name: Test the SMK-37 page
        run: node web/smoke_smk37.mjs _site

      # The SID player's wasm boots the player firmware with the page's own tune pack.
      - name: Test the FM-1 SID player page
        run: node fm1-sid/web/smoke.mjs _site/fm1-sid

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # The AArch64 JIT on Linux (the Macs test it in plugin-tests): the core's tests, then FM-1 SID's
  # committed package played with the JIT and interpreted, the same audio (the interpreter is the
  # JIT's oracle; one run may end half a buffer later, so the shorter one's length is compared).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # fm1-sid/: joakimeriksson/fm1-sid

      - name: Rust and ALSA headers
        run: |
          command -v cargo || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config

      - name: Core tests
        run: cargo test --release -p fm1-isa -p fm1-core -p fm1-soc

      - name: JIT against the interpreter
        run: |
          cargo build --release -p fm1-live
          pkg=fm1-sid/web/sidplayer.fwsc
          FM1_BENCH_WAV=jit.raw target/release/fm1-live --fwsc $pkg --bench 4000 | tee jit.txt
          FM1_NO_JIT=1 FM1_BENCH_WAV=int.raw target/release/fm1-live --fwsc $pkg --bench 4000 | tee int.txt
          n=$(stat -c %s jit.raw int.raw | sort -n | head -1)
          test "$n" -gt 100000
          cmp -n "$n" jit.raw int.raw
          # (the JIT ran: well over the interpreter's speed)
          awk '/ms emulated/ { for (i = 1; i <= NF; i++) if ($i ~ /x$/ && $(i+1) == "real") print $i + 0 }' jit.txt int.txt | paste -sd' ' - | awk 'NF == 2 { ok = $1 > 1.5 * $2 } END { exit !ok }'

      # (Android: the same AArch64 JIT, compiled only; no device here)
      - name: The JIT builds for Android
        run: |
          rustup target add aarch64-linux-android
          cargo check --release --target aarch64-linux-android -p fm1-core

  # The x86-64 JIT (jit/x64.rs): the same checks on an x86-64 runner.
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # fm1-sid/: joakimeriksson/fm1-sid

      - name: Rust and ALSA headers
        run: |
          command -v cargo || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev pkg-config

      # (the two programs' own tests too: this job has the ALSA headers fm1-live builds against;
      # two of fm1-live's boot Felucca and skip themselves without its package, so it must be there)
      - name: Firmware for fm1-live's tests
        run: |
          node tools/fetch_firmwares.mjs felucca
          test -f reference/firmwares/felucca.fwsc

      - name: Core tests
        run: cargo test --release -p fm1-isa -p fm1-core -p fm1-soc -p fm1-live -p fm1-emu

      # Clippy's errors (the lints it denies: code that is wrong or does nothing), in every crate of
      # the workspace. Its warnings are not held to: they are style, and there are some.
      - name: Clippy's errors
        run: |
          rustup component add clippy
          cargo clippy --release --workspace

      - name: JIT against the interpreter
        run: |
          cargo build --release -p fm1-live
          pkg=fm1-sid/web/sidplayer.fwsc
          FM1_BENCH_WAV=jit.raw target/release/fm1-live --fwsc $pkg --bench 4000 | tee jit.txt
          FM1_NO_JIT=1 FM1_BENCH_WAV=int.raw target/release/fm1-live --fwsc $pkg --bench 4000 | tee int.txt
          n=$(stat -c %s jit.raw int.raw | sort -n | head -1)
          test "$n" -gt 100000
          cmp -n "$n" jit.raw int.raw
          # (the JIT ran: well over the interpreter's speed)
          awk '/ms emulated/ { for (i = 1; i <= NF; i++) if ($i ~ /x$/ && $(i+1) == "real") print $i + 0 }' jit.txt int.txt | paste -sd' ' - | awk 'NF == 2 { ok = $1 > 1.5 * $2 } END { exit !ok }'

  # The x86-64 JIT on Windows (System V code, VirtualAlloc): the same checks.
  windows-x86_64:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true      # fm1-sid/: joakimeriksson/fm1-sid

      - name: Core tests
        run: cargo test --release -p fm1-isa -p fm1-core -p fm1-soc

      - name: JIT against the interpreter
        run: |
          cargo build --release -p fm1-live
          pkg=fm1-sid/web/sidplayer.fwsc
          FM1_BENCH_WAV=jit.raw target/release/fm1-live --fwsc $pkg --bench 4000 | tee jit.txt
          FM1_NO_JIT=1 FM1_BENCH_WAV=int.raw target/release/fm1-live --fwsc $pkg --bench 4000 | tee int.txt
          n=$(stat -c %s jit.raw int.raw | sort -n | head -1)
          test "$n" -gt 100000
          cmp -n "$n" jit.raw int.raw
          # (the JIT ran: well over the interpreter's speed; SID idles 81% of the cycles, so the
          # gain is diluted, and Windows runners are noisy: 1.49x on the first run)
          awk '/ms emulated/ { for (i = 1; i <= NF; i++) if ($i ~ /x$/ && $(i+1) == "real") print $i + 0 }' jit.txt int.txt | paste -sd' ' - | awk 'NF == 2 { ok = $1 > 1.3 * $2 } END { exit !ok }'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
