[package]
name = "fm1-live"
description = "Play the emulated FM-1 live: LCD window, computer keyboard as the keys, audio out"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
fm1-core = { path = "../fm1-core" }
fm1-soc = { path = "../fm1-soc" }
ab_glyph = "0.2.32"
minifb = "0.28"
cpal = "0.15"
midir = "0.10"
fm1-map = { path = "../fm1-map" }

# --exclusive: WASAPI exclusive mode
[target.'cfg(windows)'.dependencies]
wasapi = "0.26"

# a file picker for the firmware (started with no arguments, F4)
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = "0.15"

[target.'cfg(target_os = "macos")'.dependencies]
serde_json = "1"
sha2 = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem"] }
